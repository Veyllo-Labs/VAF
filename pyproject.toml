#
# Packaging metadata SSOT (PEP 621). setup.py remains only as a thin legacy
# shim. Dependency layout: [project.dependencies] is the slim base needed to
# use VAF as a headless library (`from vaf import Agent`); everything heavy
# lives in optional extras so the library stays slim. The full desktop/server
# product installs `pip install -r requirements.txt` (the canonical FLAT full
# list used by install.sh / install.ps1) - that flow is unaffected by this file.

[build-system]
# setuptools >= 77 is required for PEP 639 (SPDX license expression +
# license-files); older versions fail the isolated build on `license = "..."`.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaf"
description = "VAF - Veyllo Agentic Framework: Local AI tool for developers"
readme = "README.md"
# PEP 639 SPDX expression; emitted as License-Expression metadata. The
# deprecated `License ::` classifier is intentionally omitted (setuptools
# warns on, and PyPI rejects, specifying both).
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSING.md", "NOTICE"]
authors = [{ name = "Veyllo GmbH", email = "legal@veyllo.io" }]
# Floor only, DELIBERATELY no upper cap: an upper bound makes pip silently
# resolve older releases on newer interpreters instead of failing clearly.
# The supported range (3.10-3.13) is enforced by the installers and kept in
# lockstep with the CI matrix via tests/test_installer_python_gate.py.
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # CLI & UI
    "typer>=0.9.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    # The full-screen terminal app (vaf run). Pure-Python transitive set; imported
    # lazily inside the command body so the slim import graph stays flat.
    "textual>=8.2.8",
    "colorama>=0.4.0",
    "shellingham>=1.5.0",
    "psutil>=5.9.0",
    # API & networking (core)
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "PyGithub>=2.1.1",
    "beautifulsoup4>=4.12.0",
    "markdownify>=1.0.0",
    # LLM providers + model download
    "huggingface_hub[hf_xet]>=0.20.0",
    "tqdm>=4.65.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-genai>=1.0.0",
    # Automation / scheduling
    "schedule>=1.2.0",
    "inquirer>=3.1.0",
    # IANA tz database for zoneinfo on Windows (no system tz db); used by vaf/core/user_time.py
    "tzdata>=2024.1",
    # Linting (used by the built-in linter tool)
    "ruff>=0.1.0",
    # Schema validation for tool-input repair (core tool-dispatch path)
    "jsonschema>=4.18.0",
    # PEP 440 version parsing/comparison for the self-updater (vaf/cli/cmd/update.py)
    "packaging>=23.0",
    # Auth + encrypted credential store (core infra)
    "argon2-cffi>=23.1.0",
    "keyring>=24.0.0",
    "filelock>=3.12.0",
    "PyJWT>=2.8.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
]
discord = ["discord.py>=2.3.2"]
telegram = ["python-telegram-bot>=21.0"]
desktop = [
    "pystray>=0.19.5",
    "pillow>=10.0.0",
    "pywebview>=4.3.0",
    "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
    # PySide6 (LGPLv3) is the official Qt for Python binding. VAF is AGPL-3.0, so PyQt6
    # (GPLv3) would be license-compatible; we pick PySide6 because its weak copyleft keeps
    # the Qt *binding* itself unencumbered (dynamically linked, user-replaceable). VAF's own
    # AGPL obligations are independent of this choice. PySide6 bundles Qt WebEngine.
    "PySide6>=6.7.0; sys_platform == 'linux'",
    "qtpy>=2.0.0; sys_platform == 'linux'",
]
memory = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "sentence-transformers>=2.2.0",
    "onnxruntime>=1.16.0",
    "tokenizers>=0.15.0",
    "numpy>=1.24.0",
    "redis>=5.0.0",
]
# faster-whisper is the "local" STT engine offered in Settings. It used to be
# declared nowhere, so the option could not be satisfied by any documented
# install command; it lives in this extra rather than the base dependencies
# because its native runtime (ctranslate2) is a large platform-specific wheel
# and the recommended engine is the Whisper container.
speech = ["SpeechRecognition>=3.10.0", "pyaudio>=0.2.14", "sherpa-onnx>=1.13",
          "faster-whisper>=1.0.0"]
browser = [
    "browser-use>=0.12.9; python_version >= '3.11'",
    "playwright>=1.49.0; python_version >= '3.11'",
]
pdf = [
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.11.0",
    "pycryptodome>=3.15.0",
    "pypdfium2>=4.30.0",
    "pytesseract>=0.3.10",
]
docs = ["python-docx>=1.1.0", "openpyxl>=3.1.0", "python-pptx>=0.6.21"]
# Mail client engine (vaf/mail/, docs/integrations/EMAIL_CLIENT.md). All imports
# of these are lazy so the slim base stays importable without the extra.
mail = [
    "IMAPClient>=3.0.0",
    "nh3>=0.2.17",
    "zstandard>=0.22.0",
]
dev = ["pytest>=7.0.0", "pytest-mock>=3.10.0"]
# `all` = every extra above (parity with requirements.txt / the desktop
# product). Self-referential on purpose: it cannot drift when an extra's
# contents change. tests/test_slim_base_import.py enforces that every extra
# is referenced here.
all = ["vaf[server,discord,telegram,desktop,memory,speech,browser,pdf,docs,mail,dev]"]

[project.scripts]
vaf = "vaf.main:main"

[project.urls]
Homepage = "https://github.com/Veyllo-Labs/VAF"
Source = "https://github.com/Veyllo-Labs/VAF"
Issues = "https://github.com/Veyllo-Labs/VAF/issues"
Documentation = "https://github.com/Veyllo-Labs/VAF/blob/main/docs/EMBEDDING.md"
Changelog = "https://github.com/Veyllo-Labs/VAF/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# Explicit include: the repo root also holds non-package dirs (web/, tests/,
# scripts/, build/, models/, ...); without this, flat-layout auto-discovery
# could error out or pick up strays. Matches the historical wheel content
# (top_level.txt == "vaf").
include = ["vaf*"]

[tool.setuptools.package-data]
# Runtime assets that live INSIDE the package and are read from
# Path(__file__).parent at runtime. Measured on the built wheel, not assumed:
# before this list grew, `pip wheel .` produced 423 files of which exactly 11
# were non-Python - the vocabulary book, the coder's scaffolds, the tool
# knowledge cards and the WhatsApp bridge were all missing from an installed
# VAF. tests/test_wheel_ships_runtime_assets.py rebuilds and checks.
vaf = [
    "py.typed",
    "media/*", "media/**/*",
    # Every spoken line and every matched lexicon (vocab.__init__ reads
    # data/<key>.json). Without it the agent falls back to its built-in
    # patterns and speaks English-only defaults.
    "core/vocab/data/*.json",
    # The coder's project scaffolds (TemplateManager reads them from disk).
    "tools/coder_templates/**/*",
    # Seeded tool-usage knowledge cards for the learning system.
    "whare_wananga/knowledge/*.json",
    # Skills that ship with the product (templates._builtin_skills_dir reads
    # them from Path(__file__).parent at runtime).
    "skills/builtin/**/*",
    # The WhatsApp bridge's node app (its own package.json is the install
    # manifest the bridge runs npm against).
    "whatsapp_node/*.json", "whatsapp_node/*.js",
]

[tool.setuptools.dynamic]
# Resolved from the plain string literal in vaf/version.py via AST - the
# package is NOT imported at build time (same guarantee the old setup.py
# exec() approach had).
version = { attr = "vaf.version.__version__" }

[tool.ruff]
# Vendored third-party code (e.g. vaf/vendor/langid) and generated coder template
# placeholders are not our code to lint, so they are excluded from checks. This keeps
# the CI lint gate (E9,F63,F7,F82) green without patching vendored upstream files.
# Lives here rather than in a separate ruff.toml so the repo root carries one
# configuration file instead of two: ruff reads [tool.ruff] from pyproject.
extend-exclude = ["vaf/vendor", "vaf/tools/coder_templates"]
