name: test

# Reusable workflow: the actual build + lint + test steps. Called by ci.yml (lean,
# per-push), ci-nightly.yml (full matrix, scheduled/on-demand) and ci-latest-deps.yml
# (newest dependency versions, scheduled) with different matrices and installs, so the
# steps live in exactly one place.
#
# The job id `build-and-test` and the caller job `test` in ci.yml form the names of the
# required status checks ("test / build-and-test (ubuntu-latest, 3.10)"). Renaming either,
# giving this job a `name:`, or changing a matrix pair of ci.yml strands the branch
# ruleset (tests/test_python_ci_lock.py pins them).

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON object of matrix combinations, e.g. {"include":[{"os":"ubuntu-latest","python-version":"3.12"}]}'
        required: true
        type: string
      deps:
        # lock: requirements.lock, hash-checked (every push, the nightly matrix). latest: the
        # newest versions requirements.txt allows, what `vaf update` and the installers give a
        # user (the scheduled ci-latest-deps.yml only, never a push).
        description: 'lock or latest'
        required: false
        default: 'lock'
        type: string

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    # A hung test otherwise holds the runner for GitHub's 6 hours; the slowest job (Windows)
    # needs about 90 minutes, so 150 leaves room and still returns a log the same afternoon.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        # No pip cache, deliberately. The cache key holds neither the workflow nor the install
        # mode, so an entry the newest-versions run saved (unpinned releases) would be restored
        # by a push or the release gate, and pip trusts a wheel it built and cached past
        # --require-hashes. scripts/install_lock.sh also installs the lock with --no-cache-dir.

    # The portaudio steps (Linux portaudio19-dev, macOS brew portaudio + LDFLAGS/CFLAGS)
    # were removed together with pyaudio: it is no longer a core requirement (optional
    # vaf[speech] extra), so nothing in requirements.txt needs the portaudio headers.
    # python3-dev stays as a cheap safety net for sdist builds on Linux.
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev

    # Full runtime deps: the `vaf` CLI smoke test imports the whole app (web server,
    # tools, ...), so the slim editable base is not enough. The lock also provides ruff
    # and pytest.
    #
    # The lock, not requirements.txt: a push is tested on exactly the versions the local
    # gate (scripts/ci_check.sh) tested. Installing requirements.txt here resolved the
    # newest releases instead, so an upstream release the afternoon before turned a push
    # red that every local check had passed. The newest versions are tested on their own,
    # daily, by ci-latest-deps.yml. scripts/install_lock.sh says why each of its steps is
    # there (pip by hash, the locked setuptools for the one sdist, no cached built wheel).
    # --no-build-isolation builds the editable install with the locked setuptools instead
    # of whatever PyPI serves that minute. The drift check proves the runner really holds
    # the lock and nothing else.
    # bash on every runner: pwsh judges a multi-line step by its LAST command only, so a
    # failed install followed by a working one would pass.
    - name: Install dependencies (requirements.lock)
      if: inputs.deps == 'lock'
      shell: bash
      run: |
        bash scripts/install_lock.sh
        python -m pip install --no-deps --no-build-isolation -e .
        python scripts/check_requirements_lock.py --drift

    - name: Install dependencies (newest versions)
      id: install-latest
      if: inputs.deps == 'latest'
      shell: bash
      run: |
        python -m pip install --require-hashes --force-reinstall -r .github/requirements/pip.lock
        python -m pip install -r requirements.txt
        python -m pip install -e .
        python scripts/check_requirements_lock.py --drift --report >> "$GITHUB_STEP_SUMMARY"

    - name: Lint with Ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        # Exclude templates directory as it contains non-Python placeholder syntax
        ruff check . --select=E9,F63,F7,F82 --exclude vaf/tools/coder_templates
        # Exit-zero treats all other errors as warnings
        ruff check . --exit-zero --exclude vaf/tools/coder_templates

    - name: Lint install scripts (bash)
      if: runner.os != 'Windows'
      run: bash -n install.sh packaging/install/bootstrap.sh run_vaf.sh start_vaf.sh

    - name: Parse install scripts (PowerShell)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        foreach ($f in 'install.ps1','packaging/install/bootstrap.ps1') {
          $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$e)
          if ($e) { $e; exit 1 }
        }

    - name: Check doc links
      # Fail the build if any relative Markdown link points at a missing file.
      run: python scripts/check_doc_links.py

    - name: Check license headers
      # Fail the build if any first-party source file is missing the AGPL SPDX header
      # (VAF is dual-licensed; see LICENSING.md). Vendored code and templates are excluded.
      run: python scripts/check_license_headers.py

    - name: Verify CLI Entry Point (Smoke Test)
      run: |
        # This checks if all imports work and requirements are met
        vaf --version
        vaf --help

    - name: Run Tool Logic Tests
      # Test the tool logic, templates, and scaffolding
      # faulthandler_timeout: a test running longer than 120 s prints the stack of every
      # thread, so a wait that only happens on one platform shows where it waits even when
      # the job is cut off by the timeout above.
      run: |
        pytest tests/ -o faulthandler_timeout=120
