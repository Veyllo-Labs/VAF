name: VAF CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Lean per-commit matrix for fast feedback: the full Python matrix on Linux
    # (1x minutes) plus a single-version smoke on macOS and Windows. The exhaustive
    # 3-OS x 4-Python matrix runs nightly and on demand via ci-nightly.yml.
    # Installs requirements.lock (the default `deps` of _test.yml). The job id and these
    # six pairs are the branch ruleset's required checks: change them only together with
    # the ruleset.
    uses: ./.github/workflows/_test.yml
    with:
      matrix: '{"include":[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"macos-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.12"}]}'

  web-build:
    # The frontend is what a user actually looks at, and until this job existed
    # NOTHING in the pipeline installed or built it: a Next minor bump entered
    # the lock, every gate stayed green against a dev machine's months-old
    # node_modules, and the first computer to resolve that lock was a user's Mac
    # - where the build failed and the app never came up (v0.1.0a24).
    #
    # `npm ci` rather than `npm install` on purpose: it installs the COMMITTED
    # lock and fails outright when the lock and package.json disagree, which is
    # the other half of the same incident. Three operating systems because npm
    # resolves optional and platform-gated packages differently on each, so a
    # green Linux install proves nothing about a Mac.
    #
    # The node version pins the npm version, and that decides whether the lock is
    # accepted at all: npm 10.9.8 (node 22) refused a lock that npm 11 had happily
    # written, which is exactly how a developer machine stayed green while users
    # could not install. Regenerate the lock with the npm this job runs, not with
    # whatever is on your machine:  npx npm@10.9.8 install --package-lock-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install from the committed lock
        working-directory: web
        run: npm ci
      - name: Build the frontend
        working-directory: web
        run: npm run build
      - name: The build must not dirty the working tree
        # Next regenerates next-env.d.ts and npm can touch the lock. Whatever a
        # build writes has to be either committed or listed in the updater's
        # self-churn allowlist, or the next `vaf update` aborts on a dirty tree
        # for an edit the user never made.
        shell: bash
        run: |
          DIRTY="$(git status --porcelain -- web/)"
          if [ -n "$DIRTY" ]; then
            echo "The web build modified tracked files:" >&2
            echo "$DIRTY" >&2
            echo "Commit them, or add them to _SELF_CHURN_PATHS in vaf/cli/cmd/update.py." >&2
            exit 1
          fi

  lock-sync:
    # Supply-chain gate: requirements.lock is the hash-pinned resolution of requirements.txt,
    # and every push, the nightly matrix, the release gate and scripts/ci_check.sh install
    # it. This job regenerates it and fails if it differs from the committed lock - so a
    # dependency bump that changes requirements.txt without refreshing the lock (e.g. a
    # Dependabot PR) is caught instead of letting the hash pins silently drift - and then
    # checks it for every OS and Python of the CI matrices.
    #
    # One universal lock (uv pip compile --universal), not pip-compile: pip-compile resolves
    # for the interpreter it runs on, and its Linux/3.13 lock installed on 1 of the 12 CI
    # targets (measured: no pywin32 or colorama for Windows, no pyobjc for macOS, an
    # unmarked uvloop with no Windows wheel, numpy and onnxruntime releases that need 3.11).
    # The universal lock forks an entry where a target needs another release and marks the
    # platform-only ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system build deps (for sdist metadata resolution)
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      # BOTH pins are deliberate. A resolver tool that changes without a commit turns this job
      # red on a push that touched neither requirements file: this step once read
      # "--upgrade pip" under a comment claiming the pip-tools pin made the job deterministic,
      # and pip 26.2 (2026-07-29) removed a private symbol pip-compile imported. The one
      # unpinned input defeated the pin that was supposed to guarantee determinism. uv's output
      # also changes between releases (header, marker spelling), so raise its pin only together
      # with a regenerated lock, in one commit. scripts/ci_check.sh reads both pins from here.
      - name: Install uv (pip pinned too)
        run: python -m pip install "pip==26.1.2" "uv==0.13.6"
      # Run from the repository root WITH the committed lock present: uv keeps its pins as
      # preferences, so nothing moves unless requirements.txt asks for it, and it writes this
      # exact command (relative paths included) into the lock's header.
      - name: Verify requirements.lock is in sync with requirements.txt
        run: |
          uv pip compile requirements.txt --config-file requirements-lock.toml --universal --generate-hashes --python-version 3.10 -o requirements.lock
          if ! git diff --exit-code requirements.lock; then
            echo "::error::requirements.lock is out of sync with requirements.txt."
            echo "Fix locally (uv==0.13.6, from the repository root), then commit requirements.lock:"
            echo "  uv pip compile requirements.txt --config-file requirements-lock.toml --universal --generate-hashes --python-version 3.10 -o requirements.lock"
            exit 1
          fi
      # The checker needs `packaging`; it is taken from the lock itself, hash-checked, so no
      # version is written down twice.
      - name: Check the lock for every OS and Python of the CI matrices
        run: |
          awk '/^packaging==/{p=1; print; next} p && /^[^ ]/{exit} p{print}' requirements.lock > "$RUNNER_TEMP/packaging.txt"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/packaging.txt"
          python scripts/check_requirements_lock.py

  narrow-console:
    # THE WINDOWS FAILURE CLASS, CAUGHT ON A LINUX RUNNER IN A THIRD OF THE TIME.
    #
    # On Windows, stdout uses the active code page - cp1252 by default - whenever
    # it is not a real console, which is every CI run, every redirect and every
    # captured subprocess. Printing a character that page cannot encode raises
    # UnicodeEncodeError and kills the process. A documented example died exactly
    # that way on the first encrypted file it tried to show.
    #
    # Nothing else in this pipeline can see it coming: every other Linux job runs
    # with UTF-8 output, so the crash is unreachable there, and the windows-latest
    # entry that CAN see it takes about 90 minutes. This job re-runs the suite with the
    # narrow encoding on a fast runner, so the answer arrives with the others.
    #
    # It also hides the optional heavyweight packages (a test that quietly needs a
    # model file the runner never downloaded fails here rather than intermittently
    # elsewhere) and redirects HOME, which matters less on a throwaway runner than
    # it does locally but keeps the script honest in both places.
    #
    # And it counts every refused connect to a local port at the two seconds a
    # Windows runner waits for one, failing a test that would wait over a minute
    # there: the one cost this fast runner never pays, and the reason the Windows
    # entry once hung for hours.
    #
    # NOT in the branch ruleset's required checks. Adding a job does not add it
    # there, so this reports without blocking until someone decides otherwise -
    # a deliberate first step, not an oversight.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      # The lock, the same way as the test matrix (_test.yml explains each line).
      - name: Install dependencies (requirements.lock)
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/check_requirements_lock.py --drift
      - name: Run the suite with a narrow output encoding
        run: python scripts/hostile_env.py
