name: VAF CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Lean per-commit matrix for fast feedback: the full Python matrix on Linux
    # (1x minutes) plus a single-version smoke on macOS and Windows. The exhaustive
    # 3-OS x 4-Python matrix runs nightly and on demand via ci-nightly.yml.
    uses: ./.github/workflows/_test.yml
    with:
      matrix: '{"include":[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.11"},{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"macos-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.12"}]}'

  web-build:
    # The frontend is what a user actually looks at, and until this job existed
    # NOTHING in the pipeline installed or built it: a Next minor bump entered
    # the lock, every gate stayed green against a dev machine's months-old
    # node_modules, and the first computer to resolve that lock was a user's Mac
    # - where the build failed and the app never came up (v0.1.0a24).
    #
    # `npm ci` rather than `npm install` on purpose: it installs the COMMITTED
    # lock and fails outright when the lock and package.json disagree, which is
    # the other half of the same incident. Three operating systems because npm
    # resolves optional and platform-gated packages differently on each, so a
    # green Linux install proves nothing about a Mac.
    #
    # The node version pins the npm version, and that decides whether the lock is
    # accepted at all: npm 10.9.8 (node 22) refused a lock that npm 11 had happily
    # written, which is exactly how a developer machine stayed green while users
    # could not install. Regenerate the lock with the npm this job runs, not with
    # whatever is on your machine:  npx npm@10.9.8 install --package-lock-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install from the committed lock
        working-directory: web
        run: npm ci
      - name: Build the frontend
        working-directory: web
        run: npm run build
      - name: The build must not dirty the working tree
        # Next regenerates next-env.d.ts and npm can touch the lock. Whatever a
        # build writes has to be either committed or listed in the updater's
        # self-churn allowlist, or the next `vaf update` aborts on a dirty tree
        # for an edit the user never made.
        shell: bash
        run: |
          DIRTY="$(git status --porcelain -- web/)"
          if [ -n "$DIRTY" ]; then
            echo "The web build modified tracked files:" >&2
            echo "$DIRTY" >&2
            echo "Commit them, or add them to _SELF_CHURN_PATHS in vaf/cli/cmd/update.py." >&2
            exit 1
          fi

  lock-sync:
    # Supply-chain gate: requirements.lock is the hash-pinned (pip-compile --generate-hashes)
    # resolution of requirements.txt. This job regenerates it and fails if it differs from the
    # committed lock - so a dependency bump that changes requirements.txt without refreshing the
    # lock (e.g. a Dependabot PR) is caught instead of letting the hash pins silently drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # the lock is generated on 3.13 - see the requirements.lock header
      - name: Install system build deps (for sdist metadata resolution)
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      # BOTH pins are deliberate, and they may only be raised TOGETHER. pip-compile imports
      # private pip internals (pip._internal.utils.compat.stdlib_pkgs), so a pip release can
      # break this job without a single line changing here. That is not hypothetical: this step
      # used to read "--upgrade pip" under a comment claiming the pip-tools pin made the job
      # deterministic, and pip 26.2 (2026-07-29) removed that symbol and turned the job red on
      # the next push - a push that touched neither requirements.txt nor requirements.lock.
      # The one unpinned input defeated the pin that was supposed to guarantee determinism.
      # Measured 2026-07-30 before pinning: pip-tools 7.6.0 does NOT fix it (same import, in
      # piptools/sync.py), so raising pip-tools alone is not the way out. When a pip-tools
      # release does support a newer pip, raise both here in one commit and regenerate the lock.
      - name: Install pip-tools (pip pinned too - it is coupled, see above)
        run: python -m pip install "pip==26.1.2" "pip-tools==7.5.3"
      # The header pip-compile writes into the file records the options it
      # RESOLVED, not the ones typed here: pinned pip-tools 7.5.3 emits
      # `--no-index` even though this step does not pass it. The committed lock
      # had been generated by an older pip-tools that did not, so this job went
      # red on a push that touched neither requirements file - the diff was one
      # comment line, with all 221 pins byte-identical. Reproduced locally with
      # these exact pins before the header was refreshed. If it happens again
      # after a toolchain bump, regenerate the lock the same way (WITH the old
      # lock present in the directory, or pip-compile resolves fresh versions
      # and quietly upgrades everything) rather than editing the header by hand.
      - name: Verify requirements.lock is in sync with requirements.txt
        run: |
          pip-compile --allow-unsafe --generate-hashes --output-file=requirements.lock requirements.txt
          if ! git diff --exit-code requirements.lock; then
            echo "::error::requirements.lock is out of sync with requirements.txt."
            echo "Fix locally, then commit requirements.lock:"
            echo "  pip-compile --allow-unsafe --generate-hashes --output-file=requirements.lock requirements.txt"
            exit 1
          fi

  narrow-console:
    # THE WINDOWS FAILURE CLASS, CAUGHT ON A LINUX RUNNER IN A THIRD OF THE TIME.
    #
    # On Windows, stdout uses the active code page - cp1252 by default - whenever
    # it is not a real console, which is every CI run, every redirect and every
    # captured subprocess. Printing a character that page cannot encode raises
    # UnicodeEncodeError and kills the process. A documented example died exactly
    # that way on the first encrypted file it tried to show.
    #
    # Nothing else in this pipeline can see it coming: every other Linux job runs
    # with UTF-8 output, so the crash is unreachable there, and the windows-latest
    # entry that CAN see it takes 27 minutes. This job re-runs the suite with the
    # narrow encoding on a fast runner, so the answer arrives with the others.
    #
    # It also hides the optional heavyweight packages (a test that quietly needs a
    # model file the runner never downloaded fails here rather than intermittently
    # elsewhere) and redirects HOME, which matters less on a throwaway runner than
    # it does locally but keeps the script honest in both places.
    #
    # NOT in the branch ruleset's required checks. Adding a job does not add it
    # there, so this reports without blocking until someone decides otherwise -
    # a deliberate first step, not an oversight.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run the suite with a narrow output encoding
        run: python scripts/hostile_env.py
